unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g prefix C-s
set -g mouse on
set -sg escape-time 10

set-window-option -g mode-keys vi

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer.sh"
bind-key -r g run-shell "tmux neww ~/.local/bin/tmux-worktreeizer.sh"

set-option -g status-position top
set -g status-style bg=default

# Better status refresh
set -g status-interval 5

# More room for visual tabs
set -g status-left-length 40
set -g status-right-length 100

# Catppuccin
set -g @plugin 'catppuccin/tmux#v2.1.0'
set -g @catppuccin_window_status_style "rounded"

# Optional flavor
# set -g @catppuccin_flavor "mocha"

# Visual window tabs
setw -g window-status-separator " "

setw -g window-status-format "#[fg=colour245,bg=default] 󰎤 #I #[fg=colour245]#W "
setw -g window-status-current-format "#[fg=colour232,bg=colour110,bold] 󰮯 #I #[fg=colour232,bg=colour110,bold]#W "

# Mark activity/bell visually
setw -g window-status-activity-style fg=colour229,bg=default,bold
setw -g window-status-bell-style fg=colour203,bg=default,bold

# Pane border styling
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour110

# Left and right status
set -g status-left "#[fg=colour110,bold] 󰆍 #S "
set -g status-right "#{E:@catppuccin_status_application} #{E:@catppuccin_status_session} #[fg=colour245] %H:%M "

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'
